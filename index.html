<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>A3</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="container">
        <h1 id="header">Welcome to our experiment!</h1>
        <p id="description">
            You will be shown 80 sets of images today. For each, you will enter what percentage you estimate the smaller to be of the larger. Press the button to continue.
        </p>
         <textarea id="nameInput" placeholder="Enter your name"></textarea>
        
        <div id="scriptcontainer">
            <script type="module" src="./main.js" id="script"></script>
            <script type="module" src="./server.js"></script>
        </div>
        <p id="question" hidden>
            What percentage is the smaller estimate of Democrat victory of the larger estimate?
        </p>
        <div id="slider" hidden>
            <input type="range" id="percentInput" min="0" max="100" step="5"/>
            <label for="percentInput" id="percentLabel">H</label>
        </div>
        <button type="button" id="button">Continue</button>
    </div>
</body>
